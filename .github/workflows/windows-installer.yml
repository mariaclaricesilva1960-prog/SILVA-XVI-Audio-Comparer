name: Windows installer

# Builds the NSIS installer (electron-builder) and uploads it as a workflow artifact.
# It does not publish a release. Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same steps as "package:win", without the automatic version bump.
      - run: npm run build

      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - run: node scripts/archive-update.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: silva-xvi-windows-installer
          path: |
            release/*-Setup-*-x64.exe
            release/*-Setup-*-x64.exe.blockmap
            UPDATE/ULTIMA_VERSAO.txt
          if-no-files-found: error
